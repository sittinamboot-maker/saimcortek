name: Build unsigned iOS IPA

# กด "Run workflow" ที่แท็บ Actions บน GitHub เพื่อสั่ง build เอง
# (ไม่ build อัตโนมัติทุกครั้งที่ push เพื่อประหยัดโควต้านาที build ฟรี)
on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned .ipa
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Update CocoaPods repo
        run: pod repo update
        working-directory: ios

      - name: Build iOS app (ไม่เซ็นลายเซ็น ไม่ต้องมี Apple Developer Program)
        run: flutter build ios --release --no-codesign

      - name: Package เป็น .ipa
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qq -r -9 CortekSolarDesigner.ipa Payload

      - name: อัปโหลด .ipa เป็น artifact ให้ดาวน์โหลด
        uses: actions/upload-artifact@v4
        with:
          name: CortekSolarDesigner-ipa
          path: CortekSolarDesigner.ipa
